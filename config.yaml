llm:
  model: "gpt-4o-mini"
  temperature: 0.7
  timeout: 15

loop:
  max_iterations: 5
  target_score: 8.0
  token_budget: 15000

harness:
  max_retries: 3
  initial_delay: 1.0
  backoff_factor: 2.0
  jitter: true

memory:
  backend: "chroma"
  collection_name: "headline_memory"
  persist_directory: "./data/chroma_db"